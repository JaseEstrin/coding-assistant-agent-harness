[project]
name = "coding-assistant-agent-harness"
version = "0.1.0"
description = "Locally run agent with a custom-made harness for fast and secure coding assistance in any language."
readme = "README.md"
authors = [
    { name = "JaseEstrin", email = "jaseestrin23@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "ollama>=0.6.3",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
harness = "harness:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
